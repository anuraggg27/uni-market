<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Verify your student email</title>
  </head>
  <body style="margin:0;padding:0;background:#eee8df;font-family:Inter,Arial,sans-serif;color:#211d1a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#eee8df;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#fffdf9;border:1px solid #ded4c7;border-radius:22px;overflow:hidden;">
            <tr>
              <td style="padding:24px 28px;border-bottom:1px solid #e8dfd4;font-size:20px;font-weight:800;letter-spacing:-0.4px;">
                <span style="color:#8a4f68;">Uni</span> Market
              </td>
            </tr>
            <tr>
              <td style="padding:34px 28px 30px;">
                <p style="margin:0 0 24px;color:#746b63;font-size:14px;line-height:1.5;">Hello,</p>
                <h1 style="margin:0 0 14px;color:#211d1a;font-size:28px;line-height:1.18;letter-spacing:-0.7px;">Verify your student email</h1>
                <p style="margin:0;color:#514943;font-size:16px;line-height:1.65;">Enter this code in Uni Market to confirm your academic email address.</p>
                <div style="margin:24px 0;padding:20px;border:1px solid #ded4c7;border-radius:16px;background:#f8f4ee;text-align:center;">
                  <span style="display:block;color:#746b63;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">Verification code</span>
                  <strong style="display:block;margin-top:9px;color:#6d4055;font-family:Arial,sans-serif;font-size:34px;line-height:1;letter-spacing:0.2em;">##OTP##</strong>
                </div>
                <p style="margin:0;color:#746b63;font-size:13px;line-height:1.6;">Do not share this code. If you did not request it, you can ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px;background:#f8f4ee;border-top:1px solid #e8dfd4;">
                <p style="margin:0;color:#514943;font-size:13px;font-weight:700;">Uni Market</p>
                <p style="margin:5px 0 0;color:#746b63;font-size:12px;line-height:1.5;">Student email verification</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
