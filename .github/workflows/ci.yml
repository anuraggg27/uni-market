name: CI

on:
  push:
  pull_request:

concurrency:
  group: uni-market-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared workspace dependency
        run: npm run build -w @campus-market/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: LOG_LEVEL=silent npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared workspace dependency
        run: npm run build -w @campus-market/shared
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://uni.rocks
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy verified main branch
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          MSG91_WIDGET_ID: ${{ vars.MSG91_WIDGET_ID }}
          MSG91_OTP_LENGTH: ${{ vars.MSG91_OTP_LENGTH }}
          MSG91_TOKEN_AUTH: ${{ secrets.MSG91_TOKEN_AUTH }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
        run: |
          test -n "$MSG91_WIDGET_ID"
          test -n "$MSG91_OTP_LENGTH"
          test -n "$MSG91_TOKEN_AUTH"
          test -n "$MSG91_AUTH_KEY"
          MSG91_PAYLOAD="$({
            printf '%s\n' "$MSG91_WIDGET_ID"
            printf '%s\n' "$MSG91_OTP_LENGTH"
            printf '%s\n' "$MSG91_TOKEN_AUTH"
            printf '%s\n' "$MSG91_AUTH_KEY"
          } | base64 | tr -d '\n')"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy-with-msg91-env:$MSG91_PAYLOAD"
      - name: Verify production health
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://uni.rocks/health
