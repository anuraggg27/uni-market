name: Verified database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '47 21 * * *'

concurrency:
  group: uni-market-database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && (vars.OPERATIONS_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      restore:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: uni_restore_check
          POSTGRES_PASSWORD: isolated-ci-restore-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uni_restore_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build isolated backup tooling
        run: docker build -f infra/operations/backup.Dockerfile -t uni-market-backup-tool infra/operations
      - name: Back up, verify a real restore and upload encrypted files to private R2
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_BACKUP_ENDPOINT: ${{ vars.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/uni-market-encrypted-backup"
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/uni-market-encrypted-backup,target=/backups" \
            -e BACKUP_DATABASE_URL -e BACKUP_ENCRYPTION_KEY -e GITHUB_SHA \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e R2_BACKUP_ENDPOINT -e R2_BACKUP_BUCKET \
            -e R2_BACKUP_ACCESS_KEY_ID -e R2_BACKUP_SECRET_ACCESS_KEY \
            -e BACKUP_OUTPUT_DIR=/backups \
            -e BACKUP_RESTORE_ISOLATED=true \
            -e BACKUP_RESTORE_PASSWORD=isolated-ci-restore-only \
            uni-market-backup-tool --upload-r2

  alert:
    if: always() && github.ref == 'refs/heads/main' && (vars.OPERATIONS_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: uni-market-operational-alerts
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Notify admins independently of application SMTP
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_ALERT_ASSIGNEES: ${{ vars.OPS_ALERT_ASSIGNEES }}
          OPS_BACKUP_RESULT: ${{ needs.backup.result == 'success' && 'success' || 'failure' }}
        run: node infra/operations/monitor.mjs
